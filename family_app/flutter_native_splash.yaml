# Launch screen – to regenerate: flutter pub add --dev flutter_native_splash,
# run: dart run flutter_native_splash:create, then remove the package again
# (its iOS plugin breaks Swift Package Manager builds).
flutter_native_splash:
  color: "#FFF6EE"

  image: assets/icon/splash.png
  android_12:
    image: assets/icon/splash_android12.png
    color: "#FFF6EE"

    icon_background_color: "#F7935A"
  android: true
  ios: true
  web: false
