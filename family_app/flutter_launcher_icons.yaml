# App icons – regenerate with: dart run flutter_launcher_icons
# Source artwork: ../branding/family.svg (built and rendered into assets/icon/
# by ../branding/family-build.js).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  adaptive_icon_monochrome: "assets/icon/icon_mono.png"
  min_sdk_android: 24
